<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantics Tags in HTML</title>
</head>

<body>
    <header>Welcome to our website.</header>
    <nav>Home | About</nav>
    <main>
        <br>
        <article><b>Note:</b> Labels with asterisk are mandatory!</article>
        <hr>
        <form action="">
            <label for="name"><sup style="color: red;">*</sup>Name:</label> <br>
            <input type="text" id="name" placeholder="Enter your name:" required><br><br>

            <label for="email"><sup style="color: red;">*</sup>Email:</label> <br>
            <input type="text" id="email" placeholder="Enter your email" required> <br><br>

            <label for="password"><sup style="color: red;">*</sup>Password:</label> <br>
            <input type="password" id="password" minlength="8" required> <br><br>

            <label for="">Gender</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            <label for="country">Country</label>
            <select id="country">
                <option>Pakistan</option>
                <option>India</option>
                <option>USA</option>
            </select>
            <br><br>

            <label for="address"><sup style="color: red;">*</sup>Address:</label> <br>
            <textarea id="address" rows="4" cols="30"></textarea>
            <br><br>
        </form>

    </main>
    <aside>This is aside</aside>
    <footer>All Rights Reserved by CRT</footer>
</body>

</html>
